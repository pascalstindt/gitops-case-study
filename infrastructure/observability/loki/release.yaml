apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: loki
spec:
  interval: 1m

  chartRef:
    kind: OCIRepository
    name: loki
    namespace: loki

  values:
    deploymentMode: SingleBinary

    singleBinary:
      persistence:
        enabled: false

    loki:
      commonConfig:
        replication_factor: 1
      schemaConfig:
        configs:
          - from: "2024-04-01"
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: loki_index_
              period: 24h
      storage:
        type: filesystem

    test:
      enabled: false

    lokiCanary:
      enabled: false

    chunksCache:
      enabled: false

    resultsCache:
      enabled: false

    gateway:
      enabled: false

    backend:
      replicas: 0

    read:
      replicas: 0

    write:
      replicas: 0
